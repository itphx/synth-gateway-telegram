name: Bug report
description: Report a bug in the Synth Telegram gateway
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report!
        Please fill in the fields below. For security issues, do **not** use this
        form — see [SECURITY.md](https://github.com/itphx/synth-gateway-telegram/blob/master/SECURITY.md).
  - type: input
    id: addon-version
    attributes:
      label: Add-on version
      description: "`version` from `package.json` / `synth.pack`, or the git tag (e.g. `v0.3.2`)."
      placeholder: "0.3.2"
    validations:
      required: true
  - type: input
    id: synth-version
    attributes:
      label: Synth version
      description: Version of the Synth core you used this gateway with.
      placeholder: "0.9.0"
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - Docker
        - Helm (chart in this repository)
        - synth.pack auto-install
        - From source (pnpm)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, and any other relevant details.
      placeholder: "Ubuntu 24.04, Node.js 22.20, Docker 27"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal sequence of steps that triggers the bug.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. **Redact bot tokens, service keys and chat IDs.**
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched for existing issues and this is not a duplicate.
          required: true
        - label: I have redacted any secrets, tokens or personal data from this report.
          required: true
