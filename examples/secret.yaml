# Пример Kubernetes Secret с секретами Telegram-шлюза.
# Обычный Secret (НЕ Helm-шаблон): создайте его вне чарта и передайте имя
# в `existingSecret`. Значения замените на реальные; в git не коммитить.
#
#   kubectl -n synth apply -f examples/secret.yaml
#   helm upgrade --install synth-gateway-telegram charts/synth-gateway-telegram \
#     --namespace synth --set existingSecret=synth-gateway-telegram-secrets
#
# Полный список ключей и приоритетов — docs/configuration.md.
apiVersion: v1
kind: Secret
metadata:
  name: synth-gateway-telegram-secrets
type: Opaque
stringData:
  # Токен Telegram-бота.
  TELEGRAM_BOT_TOKEN: "REPLACE_ME"
  # Scoped service-key `synth_svc_…` (AD-052) — приоритетная машинная
  # аутентификация (выше OIDC/SYNTH_API_KEY). Требуемые scopes:
  # events:ingest, events:watch, bindings:read, bindings:write,
  # sessions:create, sessions:read; роль — LEAD.
  SYNTH_SERVICE_KEY: "REPLACE_ME"
  # Bearer-ключ API v2 (standalone/dev, legacy-fallback).
  SYNTH_API_KEY: "REPLACE_ME"
  # Список доступа chatId:ROLE через запятую.
  GATEWAY_ALLOWLIST: "123456789:ADMIN"
  # Egress-прокси Bot API (при необходимости).
  TELEGRAM_PROXY_URL: ""
  # OIDC client-credentials (managed): несекретные поля можно задать в values (oidc.*),
  # client_secret — здесь.
  SYNTH_OIDC_CLIENT_ID: "synth-gateway"
  SYNTH_OIDC_CLIENT_SECRET: "REPLACE_ME"
  SYNTH_OIDC_TOKEN_URL: "https://oidc.example.com/realms/synth/protocol/openid-connect/token"
  # Мультитенантность (опционально): весь документ `{ "tenants": [ … ] }` одним
  # ключом; нужен только при tenantsFile.enabled=true (монтируется как файл).
  # TENANTS_JSON: '{"tenants":[{"id":"dev","botToken":"…","synthUrl":"http://synth-backend:5000/api/v2","serviceKey":"synth_svc_…"}]}'
