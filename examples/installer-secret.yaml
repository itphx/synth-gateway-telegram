# Пример Kubernetes Secret с installer-ключом для авто-установки ресурсов add-on'а
# в инстанс Synth (hook-Job `autoInstall`, см. docs/deployment.md
# §«Авто-установка MCP и скиллов»).
#
# Обычный Secret (НЕ Helm-шаблон): создаётся вне чарта, имя передаётся в
# `autoInstall.installerSecretName`, ключ — в `autoInstall.installerSecretKey`.
# Job подставляет значение через secretKeyRef → env SYNTH_INSTALL_TOKEN
# и никогда не печатает его в логи.
#
#   kubectl -n synth apply -f examples/installer-secret.yaml
#
# Что за ключ: scoped-ключ инстанса Synth (AD-052) для машинной установки
# ресурсов (реестр MCP + скиллы). Целевой скоуп — `addons:install`; пока его нет,
# выдайте ключу роль ADMIN (или используйте SYNTH_API_KEY инстанса).
# Значение в git не хранить; для прода — SealedSecret/внешний секрет-менеджер.
apiVersion: v1
kind: Secret
metadata:
  name: synth-gateway-telegram-installer
type: Opaque
stringData:
  # Ключ инсталлятора (service-key `synth_svc_…` либо API-ключ инстанса).
  token: "REPLACE_ME"
