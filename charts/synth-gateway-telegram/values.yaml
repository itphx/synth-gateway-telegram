# --- Дефолтные значения для чарта synth-gateway-telegram ---
# Telegram-шлюз Synth: поллинг Telegram → внешние события API v2 (AD-089).
# Переопределяются при установке (--set, values-файл).

nameOverride: ""
fullnameOverride: ""

# ─────────────────────────────────────────────────────────────────────────────
# Поды — один Deployment.
# ─────────────────────────────────────────────────────────────────────────────
replicaCount: 1

# Стратегия обновления Deployment. Шлюз — singleton (long-polling `getUpdates`:
# второй поллер получает `409 Conflict`), поэтому rolling-обновление недопустимо —
# старый и новый поды какое-то время жили бы одновременно. `Recreate` гарантирует,
# что старый под завершён до старта нового (возможен короткий простой).
# Переопределение: `--set strategy.type=RollingUpdate` (осознанно).
strategy:
  type: Recreate

image:
  repository: gitverse.ru/itphx/synth-gateway-telegram
  tag: latest
  pullPolicy: Always

# Образ публикуется в публичный реестр (gitverse.ru) и тянется анонимно.
# Задайте свои imagePullSecrets при необходимости (для приватного реестра):
imagePullSecrets: []

# ─────────────────────────────────────────────────────────────────────────────
# Service — ClusterIP с портом health-сервера.
# ─────────────────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 7100

# ─────────────────────────────────────────────────────────────────────────────
# MCP-сервер по HTTP (Streamable HTTP) — второй контейнер в том же поде.
#
# В K3s stdio-MCP не работает (движок не спавнит процесс add-on'а), поэтому
# add-on отдаёт MCP по HTTP: Synth подключает его как `mcp.servers.<name>` типа
# `http` (напр. http://<release>:7101/mcp/<tenant>).
#
# Контейнер использует тот же образ (`node dist/mcp/index.js --http …`), тот же
# Secret (envFrom: TELEGRAM_BOT_TOKEN/SYNTH_SERVICE_KEY/… и ключ GATEWAY_MCP_TOKEN)
# и тот же PVC → инструменты видят тенантов и состояние шлюза.
#
# `port` должен совпадать с `provides.mcp.port` в addon.json: по нему чарт
# собирает URL для авто-установки (autoInstall → --service-host).
# ─────────────────────────────────────────────────────────────────────────────
mcp:
  enabled: true
  port: 7101
  # Secret с bearer-токеном клиентов MCP (ключ tokenSecretKey). Пусто — ключ
  # берётся из existingSecret (envFrom). Без токена MCP-контейнер не стартует
  # (fail-fast), значения токена в values не хранить.
  tokenSecretName: ""
  tokenSecretKey: GATEWAY_MCP_TOKEN
  resources:
    requests:
      cpu: 20m
      memory: 48Mi
    limits:
      cpu: 250m
      memory: 192Mi

# ─────────────────────────────────────────────────────────────────────────────
# Env-переменные приложения (НЕ секреты). Секреты — через existingSecret.
# ─────────────────────────────────────────────────────────────────────────────
env:
  GATEWAY_HOST: "0.0.0.0"
  GATEWAY_PORT: "7100"
  GATEWAY_DATA_DIR: "/var/lib/synth-gateway/data"
  SYNTH_URL: "http://synth-backend:5000/api/v2"
  GATEWAY_PARSE_MODE: "plain"
  # Политика отправителя, не сопоставленного с учётной записью Synth
  # (`register` — дефолт: публиковать; `hint` — публиковать и подсказать;
  # `reject` — не публиковать, ответить отказом). «Известность» резолвит ядро.
  GATEWAY_UNKNOWN_ACTION: "register"

# Имя существующего Secret (kubectl/SealedSecret) с секретами сервиса —
# подключается как envFrom. Ожидаемые ключи Secret: TELEGRAM_BOT_TOKEN,
# SYNTH_SERVICE_KEY (AD-052, приоритетный scoped service-key `synth_svc_…`),
# SYNTH_API_KEY (legacy-fallback), GATEWAY_ALLOWLIST, TELEGRAM_PROXY_URL,
# SYNTH_OIDC_CLIENT_SECRET (managed: OIDC).
# Пусто — секреты не монтируются. Значения секретов в git не хранить.
#
# Прокси Bot API приходит ТОЛЬКО из Secret (ключ TELEGRAM_PROXY_URL).
# В `env:` его добавлять нельзя: значение из `env` перекрыло бы envFrom
# (Secret), а пустое — отключило бы прокси. Файловый fallback
# (`secrets/telegram_proxy_url`) в контейнере недоступен — каталог `secrets`
# в контейнер не монтируется.
#
# Полный справочник переменных и приоритетов — docs/configuration.md.
existingSecret: ""

# ─────────────────────────────────────────────────────────────────────────────
# Доверие внутреннему CA — для тенантов с ВНЕШНИМ https-адресом Synth
# (`synthUrl` через ingress/домен внешнего https-инстанса), подписанным
# внутренним CA окружения. Node/undici (`fetch`) проверяет TLS и без CA
# отклоняет самоподписанную цепочку (SELF_SIGNED_CERT_IN_CHAIN /
# UNABLE_TO_VERIFY_LEAF_SIGNATURE). Для in-cluster http-тенанта TLS не нужен.
#
# CA — публичный сертификат (НЕ секрет). Способ задания (приоритет):
#   1) existingConfigMap — имя существующего ConfigMap с ключом configMapKey;
#   2) caCert            — PEM-строка (root+intermediate, root первым) →
#                          чарт создаёт ConfigMap <fullname>-ca.
# Файл монтируется read-only, путь выставляется в env NODE_EXTRA_CA_CERTS.
# enabled=false (дефолт) — поведение прежнее: CA не монтируется.
# ─────────────────────────────────────────────────────────────────────────────
ca:
  enabled: false
  # PEM внутреннего CA (root+intermediate, root первым). Публичный — не секрет.
  caCert: ""
  # Имя существующего ConfigMap (приоритетнее caCert). Пусто → из caCert.
  existingConfigMap: ""
  # Ключ ConfigMap с PEM (для существующего ConfigMap).
  configMapKey: ca.crt
  # Путь монтирования файла в контейнер (= значение NODE_EXTRA_CA_CERTS).
  mountPath: /etc/ssl/certs/ca.crt

# ─────────────────────────────────────────────────────────────────────────────
# Мультитенантность (несколько ботов → несколько сред Synth): монтирование
# `tenants.json` в контейнер.
#
# enabled=true — ключ `TENANTS_JSON` из Secret монтируется как файл по
# `mountPath` и выставляется env `GATEWAY_TENANTS_FILE`; шлюз обслуживает N
# ботов из файла. Single-tenant env (`TELEGRAM_BOT_TOKEN`, `SYNTH_URL`, …)
# продолжает работать как fallback-дефолт для тенантов без своих полей и как
# единственный режим, если enabled=false (поведение прежнее).
#
# Secret создаётся вне чарта (kubectl/SealedSecret) и содержит ключ `TENANTS_JSON`
# с JSON-документом `{ "tenants": [ … ] }`. Секреты (botToken/serviceKey) —
# вне git. Пусто и `secretName`, и `existingSecret` при enabled=true — ошибка.
# ─────────────────────────────────────────────────────────────────────────────
tenantsFile:
  enabled: false
  # Имя Secret с ключом `TENANTS_JSON`. Пусто → берётся `existingSecret`.
  secretName: ""
  # Ключ Secret, содержащий весь документ tenants.json.
  secretKey: TENANTS_JSON
  # Путь монтирования файла в контейнер (= значение GATEWAY_TENANTS_FILE).
  mountPath: /etc/gateway/tenants.json

# ─────────────────────────────────────────────────────────────────────────────
# Аутентификация Synth API по OIDC client-credentials (OIDC-провайдер,
# статический SYNTH_API_KEY не принимается). Несекретные поля
# (tokenUrl/discoveryUrl/clientId/scope) можно задать здесь; client_secret —
# ТОЛЬКО через existingSecret (ключ SYNTH_OIDC_CLIENT_SECRET).
# Приоритет: SYNTH_SERVICE_KEY (scoped service-key, AD-052) > OIDC > SYNTH_API_KEY.
#
# Пример: tokenUrl = <issuer>/protocol/openid-connect/token;
# client_secret — в Secret, подключаемом через existingSecret (сюда не прописывать).
# Пусто (enabled=false) → standalone/dev: аутентификация по service-key/SYNTH_API_KEY.
# ─────────────────────────────────────────────────────────────────────────────
oidc:
  enabled: false
  tokenUrl: ""
  discoveryUrl: ""
  clientId: ""
  scope: ""

# ─────────────────────────────────────────────────────────────────────────────
# Хранилище JSON-состояния (offset/дедуп/привязки чатов). Обязательно для
# шлюза: без PVC смещение long-polling теряется при рестарте пода.
# ─────────────────────────────────────────────────────────────────────────────
persistence:
  enabled: true
  # Имя существующего PVC (созданного вне чарта). Если задано — чарт PVC не
  # создаёт, а Deployment использует этот claim. Пусто → чарт создаёт PVC сам.
  existingClaim: ""
  # true → PVC не удаляется при `helm uninstall`: чарт добавляет в манифест
  # аннотацию helm.sh/resource-policy: keep. Удобно, когда данные нельзя терять.
  # (Ручной kubectl annotate живого PVC не работает — Helm смотрит манифест релиза.)
  keepOnUninstall: false
  size: 1Gi
  storageClass: ""
  mountPath: /var/lib/synth-gateway/data

# ─────────────────────────────────────────────────────────────────────────────
# Ресурсы и безопасность контейнера.
# ─────────────────────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false

# ─────────────────────────────────────────────────────────────────────────────
# Ingress — по умолчанию выключен (наружу нужен только health, обычно через
# Service в кластере; Telegram-шлюз работает исходящими запросами).
# ─────────────────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: traefik
  hosts: []
  tls: []

nodeSelector: {}
tolerations: []
affinity: {}

# ─────────────────────────────────────────────────────────────────────────────
# Авто-установка ресурсов add-on'а (из `provides` в addon.json) в инстанс Synth.
#
# Общий контракт шаблона add-on'ов (addons/synth-addon-template,
# charts/synth-addon/values.yaml): hook-Job (`templates/install-job.yaml`,
# post-install/post-upgrade) запускает `scripts/install-into-synth.mjs`:
#   managed    — API v2 инстанса Synth (реестр MCP + скиллы);
#   standalone — файлы локального инстанса (--config/--data-dir).
#
# Идемпотентно: повторный `helm upgrade` обновляет запись/скилл, а не плодит
# дубликаты. Токен — ТОЛЬКО из Secret (installerSecretName); в values не хранить.
#
# Три вида аддонов (подробности — docs/addon.md):
#   1) сервис + MCP + skills — значения по умолчанию ниже;
#   2) только MCP — `mcp.enabled=true`, `autoInstall.mcp=true`, `autoInstall.skills=false`;
#   3) только скиллы — `mcp.enabled=false`, `autoInstall.mcp=false`, `autoInstall.skills=true`.
# ─────────────────────────────────────────────────────────────────────────────
autoInstall:
  # Запускать ли hook-Job установки ресурсов.
  enabled: false
  # Базовый URL API v2 инстанса Synth, например
  # http://synth-backend.synth.svc.cluster.local:5000/api/v2
  url: ""
  # Значение подстановки {tenant} в provides.mcp.path (имя бота/среды).
  tenant: ""
  # Secret с installer-ключом (service-key/API-ключ с правами на MCP-реестр и
  # скиллы; целевой скоуп — `addons:install`, см. docs/deployment.md) и ключ в нём.
  installerSecretName: ""
  installerSecretKey: "token"
  # Что устанавливать (ресурсы берутся из addon.json `provides`).
  mcp: true
  skills: true
  # Образ для hook-Job'а. Пусто — образ чарта (image.repository:image.tag),
  # в котором есть addon.json, skills/ и scripts/install-into-synth.mjs.
  image: ""
  # Сколько раз Kubernetes повторит Job при падении.
  backoffLimit: 3
  # Путь к инсталлятору внутри образа.
  scriptPath: "scripts/install-into-synth.mjs"
  # Аддон без образа: имя существующего ConfigMap с ключом
  # `install-into-synth.mjs` (создать: kubectl create configmap <имя>
  # --from-file=install-into-synth.mjs=scripts/install-into-synth.mjs).
  # Задан — монтируется в Job, scriptPath игнорируется.
  scriptConfigMap: ""
  # Явный URL MCP-сервера (переопределяет сборку из provides.mcp + mcp.port).
  # Нужен, если MCP отдаётся не Service'ом чарта (внешний хост/ingress).
  mcpUrl: ""
  # Ресурсы hook-Job'а.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # Скиллы для аддонов без образа: чарт рендерит ConfigMap из files и монтирует
  # её в Job (инсталлятор читает дерево как `--skills-dir`). Если у аддона есть
  # образ — файлы берутся из него, эта опция не нужна.
  #
  # files — «относительный путь под корнем скиллов → содержимое», например:
  #   files:
  #     gateway-telegram/SKILL.md: |
  #       ---
  #       name: gateway-telegram
  #       description: ...
  #       ---
  #       ...
  skillsFromConfigMap:
    enabled: false
    files: {}

# ─────────────────────────────────────────────────────────────────────────────
# Произвольные дополнительные Kubernetes-манифесты. Список объектов
# (YAML-фрагменты): каждый элемент рендерится отдельным документом. Объекты без
# `metadata.namespace` попадают в namespace релиза. Пусто — ничего не
# добавляется.
# ─────────────────────────────────────────────────────────────────────────────
extraObjects: []
