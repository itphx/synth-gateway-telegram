{{- if and .Values.mcp.enabled .Values.mcp.tokenSecret.create }}
{{- $name := include "synth-gateway-telegram.mcpTokenSecretName" . }}
{{- $key := include "synth-gateway-telegram.mcpTokenSecretKey" . }}
{{- /*
  Токен генерируется один раз и переиспользуется:
  - при `helm upgrade` — значение берётся из существующего Secret (lookup);
  - при переустановке релиза — Secret остаётся в кластере (resource-policy: keep).
  Вне кластера (helm template/--dry-run) lookup ничего не находит, поэтому токен
  генерируется заново при каждом рендере — это ожидаемо: значения из рендера не
  применяются. Значение токена в values не хранится и в логи не печатается.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token := "" }}
{{- if and $existing $existing.data (index $existing.data $key) }}
{{- $token = index $existing.data $key | b64dec }}
{{- end }}
{{- if not $token }}
{{- $token = printf "synth_%s" (randAlphaNum 43) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "synth-gateway-telegram.labels" . | nindent 4 }}
  annotations:
    # Токен — неуправляемый Helm'ом ресурс: не удаляем при `helm uninstall`, иначе
    # после возврата релиза токен был бы новым, а записи реестра MCP в Synth —
    # со старым (Synth получал бы 401). Ротация — осознанно: удалить Secret и
    # переустановить релиз (или обновить запись реестра/задать свой токен).
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key }}: {{ $token | b64enc | quote }}
{{- end }}
