# Service сервиса-надстройки: ClusterIP c портом сервиса (+ порт MCP по флагу mcp.enabled).
# Порт MCP нужен инстансу Synth, чтобы подключить MCP-сервер по HTTP
# (`/mcp/<tenantId>`); контейнер MCP живёт в том же поде (общая сеть пода).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "synth-gateway-telegram.fullname" . }}
  labels:
    {{- include "synth-gateway-telegram.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.mcp.enabled }}
    - name: mcp
      port: {{ .Values.mcp.port }}
      targetPort: mcp
      protocol: TCP
    {{- end }}
  selector:
    {{- include "synth-gateway-telegram.selectorLabels" . | nindent 4 }}
