{{- if .Values.persistence.enabled }}
# PVC для JSON-хранилища add-on'а (создаётся, если persistence.enabled=true).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "synth-gateway-telegram.fullname" . }}
  labels:
    {{- include "synth-gateway-telegram.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
