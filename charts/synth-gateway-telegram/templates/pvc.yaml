{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
# PVC для JSON-хранилища add-on'а (создаётся, если persistence.enabled=true и не
# задан persistence.existingClaim — тогда монтируется существующий claim).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "synth-gateway-telegram.fullname" . }}
  labels:
    {{- include "synth-gateway-telegram.labels" . | nindent 4 }}
  {{- if .Values.persistence.keepOnUninstall }}
  # Аннотация обязана быть в манифесте релиза: Helm при uninstall фильтрует
  # ресурсы по манифесту и не видит аннотацию, проставленную вручную на живом PVC.
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
